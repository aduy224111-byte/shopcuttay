<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuyAh VNX • License Manager</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --p: #ff0077;
            --s: #ffcc00;
            --bg: #0a0a0f;
            --card: #111122;
            --card-border: #2a1a4a;
            --text: #e0e0ff;
            --text-muted: #8888aa;
            --neon-pink: #ff2d75;
            --neon-blue: #00d4ff;
            --neon-green: #00ff88;
            --neon-purple: #a855f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: radial-gradient(circle at 20% 30%, rgba(96, 165, 250, 0.15), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(192, 38, 211, 0.15), transparent 50%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: none;
        }

        /* ===== GLOW CURSOR ===== */
        #glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.15), transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: width 0.3s, height 0.3s;
            mix-blend-mode: screen;
        }
        #glow-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
            box-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10000;
            transition: 0.1s;
        }

        /* ===== MUSIC PLAYER ===== */
        .music-player {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 10px 25px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            min-width: 400px;
            justify-content: center;
        }
        .music-player input {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 18px;
            color: #fff;
            outline: none;
            width: 200px;
            font-size: 0.85rem;
        }
        .music-player input:focus { border-color: var(--neon-blue); }
        .music-player .btn-music {
            background: none;
            border: none;
            color: var(--neon-blue);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
            transition: 0.2s;
        }
        .music-player .btn-music:hover { color: var(--neon-pink); transform: scale(1.1); }
        .music-player .now-playing {
            font-size: 0.8rem;
            color: var(--text-muted);
            max-width: 150px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .music-player .now-playing b { color: var(--neon-green); }

        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: 270px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--card-border);
            padding: 30px 20px;
            z-index: 100;
            box-shadow: 5px 0 50px rgba(96, 165, 250, 0.15);
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 45px;
        }
        .logo-d {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #60a5fa, #c026d3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 40px rgba(96, 165, 250, 0.6);
        }
        .sidebar-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .menu button {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }
        .menu button:hover {
            transform: translateX(6px);
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.2);
        }
        .menu button i { font-size: 1.1rem; width: 24px; color: var(--neon-blue); }

        /* ===== MAIN ===== */
        .main {
            margin-left: 270px;
            padding: 30px 40px 100px 40px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info .email { color: var(--text-muted); font-size: 0.9rem; }
        .user-info .badge {
            background: var(--neon-pink);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #fff;
        }
        .btn-logout {
            background: #ef4444;
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .btn-logout:hover { background: #dc2626; transform: scale(1.02); }

        /* ===== STATS ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 20px;
            transition: 0.3s;
        }
        .stat-card:hover { border-color: var(--neon-blue); box-shadow: 0 0 30px rgba(0, 212, 255, 0.1); }
        .stat-card h4 { color: var(--text-muted); font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card p { font-size: 1.8rem; font-weight: 700; background: linear-gradient(90deg, #60a5fa, #c026d3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #60a5fa, #c026d3); color: #fff; }
        .btn-success { background: var(--neon-green); color: #000; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-warning { background: var(--s); color: #000; }
        .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
        .search-input {
            padding: 10px 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            color: #fff;
            width: 220px;
            font-size: 0.85rem;
            outline: none;
            transition: 0.3s;
        }
        .search-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 212, 255, 0.15); }

        /* ===== TABLE ===== */
        .table-wrap {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: auto;
            padding: 0 5px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 800px; }
        th { padding: 14px 12px; text-align: left; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--card-border); }
        td { padding: 12px; border-bottom: 1px solid rgba(42, 26, 74, 0.4); }
        tr:hover td { background: rgba(42, 26, 74, 0.2); }
        .status {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-unused { background: #f59e0b; color: #000; }
        .status-used { background: var(--neon-green); color: #000; }
        .status-banned { background: #ef4444; color: #fff; }
        .status-expired { background: #6b7280; color: #fff; }
        .key-text { color: var(--neon-pink); font-weight: 600; letter-spacing: 0.5px; }
        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            margin: 2px;
            transition: 0.2s;
        }
        .action-btn:hover { transform: scale(1.05); }

        /* ===== LOGIN ===== */
        .login-screen {
            position: fixed;
            inset: 0;
            background: rgba(2, 4, 10, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }
        .login-box {
            width: 440px;
            padding: 50px 40px;
            text-align: center;
            background: rgba(15, 23, 42, 0.98);
            border-radius: 28px;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
            animation: loginSlide 0.6s ease-out;
        }
        @keyframes loginSlide {
            0% { opacity: 0; transform: scale(0.9) translateY(-30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .login-box .logo-big {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #60a5fa, #c026d3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            margin: 0 auto 18px;
            box-shadow: 0 0 50px rgba(96, 165, 250, 0.4);
        }
        .login-box h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #60a5fa, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-box p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
        .login-box input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 18px;
            outline: none;
            transition: 0.3s;
        }
        .login-box input:focus { border-color: var(--neon-blue); box-shadow: 0 0 25px rgba(0, 212, 255, 0.15); }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #60a5fa, #c026d3);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 35px rgba(96, 165, 250, 0.3);
        }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 50px rgba(96, 165, 250, 0.4); }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            animation: modalIn 0.3s ease-out;
        }
        @keyframes modalIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        .modal-content h2 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #60a5fa, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .modal-content input:focus, .modal-content select:focus { border-color: var(--neon-blue); }
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .modal-actions .btn { flex: 1; justify-content: center; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 14px;
            background: linear-gradient(90deg, #60a5fa, #c026d3);
            color: #fff;
            font-weight: 600;
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(96, 165, 250, 0.4);
            animation: toastIn 0.4s ease-out;
        }
        .toast.error { background: #ef4444; }
        .toast.success { background: var(--neon-green); color: #000; }
        @keyframes toastIn { 0% { transform: translateX(120%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

        @media (max-width: 768px) {
            .sidebar { width: 200px; padding: 20px 14px; }
            .sidebar-title { font-size: 1.2rem; }
            .main { margin-left: 200px; padding: 20px; }
            .title { font-size: 1.5rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .login-box { width: 95%; padding: 30px 20px; }
            .music-player { min-width: auto; width: 95%; flex-wrap: wrap; padding: 10px 15px; }
            .music-player input { width: 120px; }
        }
        @media (max-width: 600px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>

<!-- ====== GLOW CURSOR ====== -->
<div id="glow"></div>
<div id="glow-dot"></div>

<!-- ====== MUSIC PLAYER ====== -->
<div class="music-player" id="musicPlayer">
    <button class="btn-music" onclick="toggleMusic()"><i class="fas fa-play" id="playIcon"></i></button>
    <input type="text" id="songSearch" placeholder="Tìm bài hát..." onkeydown="if(event.key==='Enter') searchSong()">
    <button class="btn-music" onclick="searchSong()"><i class="fas fa-search"></i></button>
    <span class="now-playing" id="nowPlaying">🎵 <b>Chưa chọn nhạc</b></span>
    <button class="btn-music" onclick="nextSong()"><i class="fas fa-forward"></i></button>
    <button class="btn-music" onclick="prevSong()"><i class="fas fa-backward"></i></button>
    <input type="range" id="volumeSlider" min="0" max="100" value="50" style="width:60px; accent-color:var(--neon-blue);" oninput="setVolume(this.value)">
</div>

<!-- ====== LOGIN ====== -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="logo-big">D</div>
        <h1>DuyAh VNX</h1>
        <p>🔐 License Management System</p>
        <input type="password" id="adminPass" placeholder="Nhập mật khẩu admin">
        <button class="login-btn" onclick="login()">ĐĂNG NHẬP</button>
    </div>
</div>

<!-- ====== MAIN ====== -->
<div class="container" id="mainApp" style="display:none;">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-d">D</div>
            <div class="sidebar-title">DuyAh VNX</div>
        </div>
        <div class="menu">
            <button onclick="openCreate()"><i class="fas fa-key"></i> Tạo Key Mới</button>
            <button onclick="exportKeys()"><i class="fas fa-file-export"></i> Xuất Keys</button>
            <button onclick="deleteAll()"><i class="fas fa-trash"></i> Xóa Tất Cả</button>
            <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</button>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <div class="title">📊 Bảng Điều Khiển</div>
            <div class="user-info">
                <span class="email" id="userEmail">Admin</span>
                <span class="badge">ADMIN</span>
                <button class="btn-logout" onclick="logout()">Thoát</button>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card"><h4>Tổng Key</h4><p id="total">0</p></div>
            <div class="stat-card"><h4>Đã Dùng</h4><p id="used">0</p></div>
            <div class="stat-card"><h4>Chưa Dùng</h4><p id="unused">0</p></div>
            <div class="stat-card"><h4>Bị Ban</h4><p id="banned">0</p></div>
            <div class="stat-card"><h4>Hết Hạn</h4><p id="expired">0</p></div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="openCreate()"><i class="fas fa-plus"></i> Tạo Key</button>
            <button class="btn btn-success" onclick="exportKeys()"><i class="fas fa-download"></i> Xuất Keys</button>
            <button class="btn btn-danger" onclick="deleteAll()"><i class="fas fa-trash"></i> Xóa Tất Cả</button>
            <input class="search-input" type="text" id="search" placeholder="🔍 Tìm key..." oninput="searchKey()">
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>#</th><th>License Key</th><th>Thời Hạn</th><th>Còn Lại</th><th>Máy</th><th>Trạng Thái</th><th>Ghi Chú</th><th>Hành Động</th></tr>
                </thead>
                <tbody id="keysTable"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ====== CREATE MODAL ====== -->
<div class="modal" id="createModal">
    <div class="modal-content">
        <h2>🔑 Tạo License Key</h2>
        <input type="text" id="customKey" placeholder="Nhập key (để trống tự tạo)">
        <select id="duration">
            <option value="1_day">1 Ngày</option>
            <option value="7_days">7 Ngày</option>
            <option value="30_days">30 Ngày</option>
            <option value="90_days">3 Tháng</option>
            <option value="lifetime" selected>Vĩnh Viễn</option>
        </select>
        <select id="deviceLimit">
            <option value="1">1 Máy</option>
            <option value="unlimited" selected>Không Giới Hạn</option>
        </select>
        <input type="text" id="note" placeholder="Ghi chú (tùy chọn)">
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="createKey()">Tạo</button>
            <button class="btn btn-danger" onclick="closeCreate()">Đóng</button>
        </div>
    </div>
</div>

<!-- ====== TOAST ====== -->
<div class="toast" id="toast"><i class="fas fa-bell"></i> <span id="toastMsg">Thông báo</span></div>

<script>
// ====== FIREBASE ======
const firebaseConfig = {
    apiKey: "AIzaSyAOcavYOsOGgRnmfPKeojppLoP6hPYe6pI",
    authDomain: "shopcuttay.firebaseapp.com",
    databaseURL: "https://shopcuttay-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shopcuttay",
    storageBucket: "shopcuttay.firebasestorage.app",
    messagingSenderId: "275809822981",
    appId: "1:275809822981:web:02e33ad2515eed78b32f6c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allKeys = [];

// ====== GLOW CURSOR ======
document.addEventListener('mousemove', (e) => {
    const glow = document.getElementById('glow');
    const dot = document.getElementById('glow-dot');
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';
});

// ====== MUSIC PLAYER ======
let currentSong = null;
let audio = new Audio();
let isPlaying = false;
let playlist = [];
let currentIndex = 0;

function searchSong() {
    const query = document.getElementById('songSearch').value.trim();
    if (!query) return toast('Vui lòng nhập tên bài hát!', 'error');
    toast('🔍 Đang tìm: ' + query, '');
    // Tìm kiếm trên YouTube và phát
    const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
    // Mở tab mới để nghe (cách đơn giản nhất)
    window.open(searchUrl, '_blank');
    document.getElementById('nowPlaying').innerHTML = `🎵 <b>${query}</b> (đang mở YouTube)`;
}

function toggleMusic() {
    if (audio.paused) {
        audio.play();
        document.getElementById('playIcon').className = 'fas fa-pause';
        isPlaying = true;
    } else {
        audio.pause();
        document.getElementById('playIcon').className = 'fas fa-play';
        isPlaying = false;
    }
}

function setVolume(val) {

// ====== LOGIN ======
function login() {
    const pass = document.getElementById('adminPass').value.trim();
    if (pass === 'DuyAhVNX') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        localStorage.setItem('duyah_logged', 'true');
        loadKeys();
        toast('✅ Đăng nhập thành công!', 'success');
    } else {
        toast('❌ Mật khẩu sai!', 'error');
    }
}

function logout() {
    localStorage.removeItem('duyah_logged');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('adminPass').value = '';
    toast('Đã đăng xuất', '');
}

// ====== LOAD KEYS ======
function loadKeys() {
    db.ref('keys').on('value', snap => {
        allKeys = [];
        snap.forEach(child => {
            const data = child.val();
            data.id = child.key;
            allKeys.push(data);
        });
        renderTable(allKeys);
        updateStats(allKeys);
    });
}

function renderTable(keys) {
    let html = '';
    keys.forEach((k, i) => {
        const status = getStatus(k);
        const remaining = getRemaining(k.expires_at);
        const durLabel = getDurationLabel(k.duration);
        html += `<tr>
            <td>${i+1}</td>
            <td><span class="key-text">${k.license_key}</span></td>
            <td>${durLabel}</td>
            <td>${remaining}</td>
            <td>${k.devices === 'unlimited' ? '♾️' : k.devices || '1'}</td>
            <td><span class="status status-${status.cls}">${status.text}</span></td>
            <td>${k.note || '-'}</td>
            <td>
                <button class="action-btn" style="background:#3b82f6;color:#fff;" onclick="copyKey('${k.license_key}')">Copy</button>
                <button class="action-btn" style="background:#ef4444;color:#fff;" onclick="deleteKey('${k.id}')">Xóa</button>
                ${k.status !== 'banned' ? `<button class="action-btn" style="background:#ef4444;color:#fff;" onclick="banKey('${k.id}')">Ban</button>` : `<button class="action-btn" style="background:#22c55e;color:#000;" onclick="unbanKey('${k.id}')">Unban</button>`}
                <button class="action-btn" style="background:#f59e0b;color:#000;" onclick="markUsed('${k.id}')">Dùng</button>
            </td>
        </tr>`;
    });
    document.getElementById('keysTable').innerHTML = html || '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:30px;">Chưa có key nào</td></tr>';
}

function updateStats(keys) {
    const total = keys.length;
    const used = keys.filter(k => k.status === 'used').length;
    const unused = keys.filter(k => k.status === 'unused').length;
    const banned = keys.filter(k => k.status === 'banned').length;
    const expired = keys.filter(k => k.expires_at && new Date(k.expires_at) < new Date() && k.status !== 'banned').length;
    document.getElementById('total').textContent = total;
    document.getElementById('used').textContent = used;
    document.getElementById('unused').textContent = unused;
    document.getElementById('banned').textContent = banned;
    document.getElementById('expired').textContent = expired;
}

// ====== HELPERS ======
function getStatus(k) {
    if (k.status === 'banned') return {text: 'BỊ BAN', cls: 'banned'};
    if (k.expires_at && new Date(k.expires_at) < new Date()) return {text: 'HẾT HẠN', cls: 'expired'};
    if (k.status === 'used') return {text: 'ĐÃ DÙNG', cls: 'used'};
    return {text: 'CHƯA DÙNG', cls: 'unused'};
}
function getRemaining(exp) {
    if (!exp) return '♾️';
    const diff = new Date(exp) - new Date();
    if (diff < 0) return '⏰ Hết';
    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    return d > 0 ? `${d}d ${h}h` : `${h}h`;
}
function getDurationLabel(d) {
    const map = {'1_day':'1 Ngày','7_days':'7 Ngày','30_days':'30 Ngày','90_days':'3 Tháng','lifetime':'Vĩnh Viễn'};
    return map[d] || d || 'Vĩnh Viễn';
}
function generateKey() {
    const p2 = Math.random().toString(36).substring(2,5).toUpperCase();
    const p3 = Math.random().toString(36).substring(2,6).toUpperCase();
    return `AIMBODY-${p2}-${p3}`;
}

// ====== SEARCH ======
function searchKey() {
    const val = document.getElementById('search').value.toLowerCase();
    renderTable(allKeys.filter(k => k.license_key.toLowerCase().includes(val)));
}

// ====== CREATE ======
function openCreate() { document.getElementById('createModal').style.display = 'flex'; }
function closeCreate() { document.getElementById('createModal').style.display = 'none'; }

function createKey() {
    const custom = document.getElementById('customKey').value.trim();
    const duration = document.getElementById('duration').value;
    const devices = document.getElementById('deviceLimit').value;
    const note = document.getElementById('note').value.trim();
    const key = custom || generateKey();
    let expires_at = null;
    const now = new Date();
    const map = {'1_day':1,'7_days':7,'30_days':30,'90_days':90};
    if (duration !== 'lifetime') {
        expires_at = new Date(now.getTime() + map[duration]*24*60*60*1000);
    }
    db.ref('keys').push({
        license_key: key,
        status: 'unused',
        duration: duration,
        devices: devices,
        note: note,
        created_at: now.toISOString(),
        expires_at: expires_at ? expires_at.toISOString() : null
    }).then(() => {
        toast('✅ Đã tạo key: ' + key, 'success');
        closeCreate();
        document.getElementById('customKey').value = '';
        document.getElementById('note').value = '';
    }).catch(e => toast('❌ Lỗi: ' + e.message, 'error'));
}

// ====== DELETE, BAN, UNBAN, USED ======
function deleteKey(id) {
    if (!confirm('Xóa key này?')) return;
    db.ref('keys/' + id).remove().then(() => toast('✅ Đã xóa key', 'success'));
}
function banKey(id) {
    const reason = prompt('Lý do ban?');
    if (reason === null) return;
    db.ref('keys/' + id).update({status: 'banned', ban_reason: reason}).then(() => toast('⛔ Key đã bị ban', ''));
}
function unbanKey(id) {
    db.ref('keys/' + id).update({status: 'unused', ban_reason: null}).then(() => toast('✅ Key đã unban', 'success'));
}
function markUsed(id) {
    db.ref('keys/' + id).update({status: 'used'}).then(() => toast('✅ Đã đánh dấu đã dùng', 'success'));
}

// ====== DELETE ALL ======
function deleteAll() {
    if (!confirm('XÓA TẤT CẢ KEY?')) return;
    db.ref('keys').remove().then(() => toast('🗑️ Đã xóa tất cả', ''));
}

// ====== EXPORT ======
function exportKeys() {
    const txt = allKeys.map(k => k.license_key).join('\n');
    const blob = new Blob([txt], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'DuyAh_Keys.txt';
    a.click();
    toast('📥 Đã xuất keys', 'success');
}

// ====== COPY ======
function copyKey(key) {
    navigator.clipboard.writeText(key);
    toast('📋 Đã copy: ' + key, 'success');
}

// ====== TOAST ======
function toast(msg, type) {
    const el = document.getElementById('toast');
    const msgEl = document.getElementById('toastMsg');
    el.className = 'toast';
    if (type === 'error') el.classList.add('error');
    if (type === 'success') el.classList.add('success');
    msgEl.textContent = msg;
    el.style.display = 'flex';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.style.display = 'none', 3000);
}

// ====== AUTO LOGIN ======
window.addEventListener('load', () => {
    if (localStorage.getItem('duyah_logged') === 'true') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        loadKeys();
    }
});
